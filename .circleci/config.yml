version: 2.1

anchors:
  context: &context
    context: shared

  default_job_config: &default_job_config
    working_directory: /home/circleci/plugin
    machine:
      image: default

  test_job_config: &test_job_config
    <<: *context
    requires:
      - prepare

commands:
  configure_git:
    steps:
      - run:
          name: Configure git
          command: |
            git config user.email "support@gravitykit.com"
            git config user.name "GravityKit - CI"

  # Every branch publishes a build. Caches are shared by every branch, so the
  # zip is never built from one: a cache an unreviewed branch saved under the
  # same key could otherwise ship.
  # Build and publish jobs start from their own checkout, never from the
  # prepare workspace. On a branch, prepare runs tools from a shared cache, so
  # anything they wrote into the plugin folder could otherwise ship in the zip
  # or ride along in a translations commit. Only the build job's own output
  # crosses over: the zip and its tree (see publish_release).
  clean_checkout:
    steps:
      - checkout
      - run:
          name: Fetch tags and configure npm
          command: |
            git fetch --tags
            echo "//npm.pkg.github.com/:_authToken=${GH_AUTH_TOKEN}" >> ~/.npmrc
            echo "@gravitykit:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "audit=false" >> ~/.npmrc
            echo "fund=false" >> ~/.npmrc
            echo "update-notifier=false" >> ~/.npmrc

  install_build_deps_fresh:
    steps:
      - run:
          name: Install the build's dependencies from scratch
          command: |
            rm -rf node_modules vendor vendor_prefixed
            npx @gravitykit/gktools composer install
            npx @gravitykit/gktools npm install

  build_zip:
    steps:
      - configure_git
      - run:
          name: Replace @since tags
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              npx @gravitykit/gktools replace-since --commit
            else
              echo "Skipping @since tag replacement (only runs on main, before release build)."
            fi
      - run:
          name: Build and package
          command: npx @gravitykit/gktools build
      - run:
          name: Sign build
          command: npx @gravitykit/gktools sign
      - run:
          name: Collect build artifacts
          # The publish job runs translate, release and announce against this
          # job's tree: the regenerated translations.pot, the replace-since
          # commit on main, and the tracked files the build changed, which
          # `gktools release` commits. Ignored dependency folders stay out.
          command: |
            mkdir -p .release .build-out
            cp gravityview-az-filters-*.zip .release/
            tar -czf /tmp/build-tree.tgz \
              --exclude=./node_modules --exclude=./vendor --exclude=./vendor_prefixed \
              --exclude=./.tmp --exclude=./.release --exclude=./.build-out .
            mv /tmp/build-tree.tgz .build-out/

  # Runs only after the tests that gate it have passed, because it pushes
  # translations and creates the GitHub release.
  publish_zip:
    steps:
      - run:
          name: Trigger translation pipeline
          command: |
            if [ "${CIRCLE_BRANCH}" == "develop" ] || [ "${CIRCLE_BRANCH}" == "main" ]; then
              npx @gravitykit/gktools translate gravityview-az-filters --commit --push
            else
              echo "Skipping translation pipeline."
            fi
      - run:
          name: Create GitHub release
          command: npx @gravitykit/gktools release
      - run:
          name: Announce build
          command: |
            if ! git log -1 --pretty=%B | grep -iq "\[skip notify\]"; then
              npx @gravitykit/gktools announce
            fi

  # node_modules is kept out of the workspace, so only the jobs that run node
  # pay to download it. They restore the exact cache `prepare` saved; if that
  # cache is missing (another pipeline held the key and its upload was
  # skipped), this installs instead. Build jobs never call this: see
  # install_build_deps_fresh.
  restore_node_modules:
    steps:
      # Never on main or main-beta: caches are shared by every branch, so a
      # release pipeline installs from scratch rather than run code a branch saved.
      - when:
          condition:
            not:
              matches:
                pattern: "^main(-beta)?$"
                value: << pipeline.git.branch >>
          steps:
            - restore_cache:
                keys:
                  - npm-v1-{{ checksum "/home/circleci/.ci-deps/npm.want" }}
      - run:
          name: Install npm dependencies if the cache missed
          command: |
            if [ -d node_modules ]; then
              echo "node_modules restored from cache."
              exit 0
            fi
            npx @gravitykit/gktools npm install

jobs:
  prepare:
    parameters:
      # false on main and main-beta. Their vendor and node_modules are
      # installed from scratch, never from a cache a branch could have written.
      restore_dep_caches:
        type: boolean
        default: true
    <<: *default_job_config
    steps:
      - checkout
      - run:
          name: Fetch tags
          command: git fetch --tags
      - run:
          name: Create .npmrc
          # npm's audit runs on every install and nothing here reads it.
          command: |
            echo "//npm.pkg.github.com/:_authToken=${GH_AUTH_TOKEN}" >> ~/.npmrc
            echo "@gravitykit:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "audit=false" >> ~/.npmrc
            echo "fund=false" >> ~/.npmrc
            echo "update-notifier=false" >> ~/.npmrc
      # One hash per tool, over everything that decides what its install
      # produces. The cache keys and the skip check in "Install dependencies"
      # both read these files, so they cannot disagree. The month is in the
      # hash because gktools installs inside a Docker image whose tag can move,
      # so each cache is rebuilt at least once a month.
      - run:
          name: Hash dependency inputs
          command: |
            mkdir -p ~/.ci-deps
            { cat package-lock.json package.json; date -u +%Y-%m; } | sha256sum > ~/.ci-deps/npm.want
            { cat composer.lock composer.json; date -u +%Y-%m; } | sha256sum > ~/.ci-deps/composer.want
      # Keyed on the lockfiles, not the branch: two branches with the same
      # lockfile need the same install. The bare prefix restores the newest
      # cache when a lockfile changed, so the install only applies the change.
      - when:
          condition: << parameters.restore_dep_caches >>
          steps:
            # Never on main or main-beta: caches are shared by every branch, so a
            # release pipeline installs from scratch rather than run code a branch saved.
            - when:
                condition:
                  not:
                    matches:
                      pattern: "^main(-beta)?$"
                      value: << pipeline.git.branch >>
                steps:
                  - restore_cache:
                      keys:
                        - npm-v1-{{ checksum "/home/circleci/.ci-deps/npm.want" }}
                        - npm-v1-
            # Never on main or main-beta: caches are shared by every branch, so a
            # release pipeline installs from scratch rather than run code a branch saved.
            - when:
                condition:
                  not:
                    matches:
                      pattern: "^main(-beta)?$"
                      value: << pipeline.git.branch >>
                steps:
                  - restore_cache:
                      keys:
                        - composer-v1-{{ checksum "/home/circleci/.ci-deps/composer.want" }}
                        - composer-v1-
      # `v1` is the manual bust: bump it here and in save_cache. No bare
      # `gkunit-deps-` fallback, since prefix matching would ignore the bust.
      # Never on main or main-beta: caches are shared by every branch, so a
      # release pipeline installs from scratch rather than run code a branch saved.
      - when:
          condition:
            not:
              matches:
                pattern: "^main(-beta)?$"
                value: << pipeline.git.branch >>
          steps:
            - restore_cache:
                keys:
                  - gkunit-deps-v1-{{ checksum ".gkunit.matrix.yml" }}-
      - run:
          name: Install dependencies
          # A restored cache whose `.have` matches `.want` was built from these
          # exact inputs, so its install is skipped. The Composer autoloader is
          # still rebuilt: its classmap lists this branch's classes, and the
          # cache may come from another branch.
          command: |
            if cmp -s ~/.ci-deps/composer.want ~/.ci-deps/composer.have; then
              echo "vendor was built from this composer.lock; rebuilding the autoloader only."
              npx @gravitykit/gktools composer dump-autoload -o
            else
              npx @gravitykit/gktools composer install
              cp ~/.ci-deps/composer.want ~/.ci-deps/composer.have
            fi

            if cmp -s ~/.ci-deps/npm.want ~/.ci-deps/npm.have; then
              echo "node_modules was built from this package-lock.json; skipping npm install."
            else
              npx @gravitykit/gktools npm install
              cp ~/.ci-deps/npm.want ~/.ci-deps/npm.have
            fi
      - run:
          name: Configure E2E environment
          # A-Z Filters is a GravityView extension: its widget only loads when
          # GravityView (and Gravity Forms) are active. CI has no sibling repos,
          # so mount both via WP_ENV_PLUGINS. GravityView is git-cloned (not the
          # release zip) because the PHPUnit suite chains into its tests/
          # bootstrap; `composer install` generates its prefixed Foundation.
          command: |
            npx @gravitykit/gktools gh release download -R gravityforms/gravityforms --clobber --pattern "*.zip" --dir .tmp
            unzip .tmp/gravityforms*.zip -d .tmp
            # main ships to sites running the released GravityView, so it tests
            # against the latest release. Every other branch tests against develop.
            gv_ref=develop
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              gv_ref=$(npx @gravitykit/gktools gh release view -R GravityKit/GravityView --json tagName --jq .tagName)
            fi
            echo "Testing against GravityView ${gv_ref}."
            git clone --depth 1 --branch "${gv_ref}" "https://x-access-token:${GH_AUTH_TOKEN}@github.com/GravityKit/GravityView.git" .tmp/gravityview
            (cd .tmp/gravityview && npx @gravitykit/gktools composer install)
            # The unit test runner uses this clone too, instead of downloading
            # the latest release on its own.
            echo "GV_PLUGIN_DIR=${PWD}/.tmp/gravityview" >> .gkunit.env
            cp .env.example .env
            sed -i "s|WP_ENV_PLUGINS=.*|WP_ENV_PLUGINS=${PWD}/.tmp/gravityforms,${PWD}/.tmp/gravityview|" .env
            sed -i "s|GRAVITY_FORMS_LICENSE_KEY=.*|GRAVITY_FORMS_LICENSE_KEY=${GRAVITYFORMS_KEY}|" .env
            sed -i "s|GRAVITYKIT_LICENSE_KEY=.*|GRAVITYKIT_LICENSE_KEY=${GRAVITYVIEW_KEY}|" .env
      - run:
          name: Prepare unit test dependencies
          # After the clone above, so it uses that GravityView (and checks it)
          # instead of downloading the latest release.
          command: npx @gravitykit/phpunit@^1.2.0 prepare
      - save_cache:
          key: npm-v1-{{ checksum "/home/circleci/.ci-deps/npm.want" }}
          paths:
            - /home/circleci/plugin/node_modules
            - /home/circleci/.ci-deps/npm.have
      - save_cache:
          key: composer-v1-{{ checksum "/home/circleci/.ci-deps/composer.want" }}
          paths:
            - /home/circleci/plugin/vendor
            - /home/circleci/.ci-deps/composer.have
      # Keyed on what is in the cache: the manifest records the test suite
      # versions `prepare` downloaded, so a run with nothing new uploads
      # nothing and a run after a new release saves the fresh copy.
      - save_cache:
          key: gkunit-deps-v1-{{ checksum ".gkunit.matrix.yml" }}-{{ checksum "/home/circleci/.cache/gkunit/.cache-manifest.json" }}
          paths:
            - /home/circleci/.cache/gkunit
      # The jobs that need node_modules restore the npm cache saved above.
      - run:
          name: Leave node_modules out of the workspace
          command: rm -rf node_modules
      # Only what later jobs use. Composer's download cache and auth file stay
      # behind; gktools hands Docker its credentials as environment variables.
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - plugin
            - .cache/gkunit
            - .npmrc
            - .ssh
            - .npm/_npx
            - .ci-deps/npm.want

  # One job per PHP version, mirroring .gkunit.matrix.yml, so the versions run
  # at the same time on separate machines instead of one after the other.
  run_unit_tests:
    parameters:
      php:
        type: string
    <<: *default_job_config
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run PHP << parameters.php >> unit tests
          # The suite bootstraps GravityView from the clone made in `prepare`
          # (GV_PLUGIN_DIR in .gkunit.env).
          command: |
            if git log -1 --pretty=%B | grep -iq "\[skip tests\]"; then
              echo "Skipping tests."
              exit 0
            fi
            npx @gravitykit/phpunit@^1.2.0 test --php << parameters.php >> --db mysql:8.0 --junit tests/junit.xml
      - store_test_results:
          path: tests/junit.xml

  run_e2e_tests:
    <<: *default_job_config
    parallelism: 1
    resource_class: xlarge
    steps:
      - attach_workspace:
          at: /home/circleci
      - restore_node_modules
      - run:
          name: Run E2E tests
          command: |
            attempt=0
            max_attempts=3
            sleep_time=5
            while [ $attempt -lt $max_attempts ]; do
              npm run tests:e2e:setup && break
              attempt=$(( attempt + 1 ))
              sudo rm -rf /home/circleci/.wp-env
              echo "Retrying WP-ENV setup in $sleep_time seconds… (attempt $attempt/$max_attempts)"
              sleep $sleep_time
            done
            if [ $attempt -eq $max_attempts ]; then
              echo "WP-ENV setup failed."
              exit 1
            fi
            TESTFILES=$(circleci tests glob "tests/E2E/tests/**/*.spec.js")
            echo "$TESTFILES" | circleci tests run --command="xargs npx playwright test --config=tests/E2E/setup/playwright.config.js" --verbose
      - store_artifacts:
          path: tests/E2E/results
      - store_artifacts:
          path: tests/E2E/report
      - store_test_results:
          path: tests/E2E/results/junit.xml

  # Builds the zip. Off main and main-beta it runs beside the tests, because
  # nothing in the build reads their results; publish_release waits for the
  # tests before anything leaves CI. On main and main-beta the tests gate it,
  # because replace-since commits before the build there.
  build_package:
    <<: *default_job_config
    steps:
      - clean_checkout
      - install_build_deps_fresh
      - build_zip
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - plugin/.release
            - plugin/.build-out
      - store_artifacts:
          path: .release
          destination: release

  publish_release:
    <<: *default_job_config
    steps:
      - clean_checkout
      - attach_workspace:
          at: /tmp/workspace
      # The tree comes from build_package, which also started from a clean
      # checkout, so nothing prepare wrote reaches it. It carries
      # translations.pot, the replace-since commit and the tracked files the
      # build changed, which translate and release commit and push.
      - run:
          name: Restore the build's tree
          command: |
            tar -xzf /tmp/workspace/plugin/.build-out/build-tree.tgz
            cp /tmp/workspace/plugin/.release/*.zip .
      - configure_git
      - publish_zip

workflows:
  version: 2
  # Every branch except main and main-beta. The zip builds beside the tests.
  # E2E runs but does not hold up the dev build, so a red E2E on develop
  # still produces one; the unit tests do hold it.
  test_and_package:
    when:
      not:
        matches:
          pattern: "^main(-beta)?$"
          value: << pipeline.git.branch >>
    jobs:
      - prepare:
          <<: *context
      - run_unit_tests:
          <<: *test_job_config
          # Mirrors .gkunit.matrix.yml. Keep the two in sync.
          matrix:
            parameters:
              php: ['7.4', '8.0']
      - run_e2e_tests:
          <<: *test_job_config
      - build_package:
          <<: *context
          requires:
            - prepare
      - publish_release:
          <<: *context
          requires:
            - build_package
            - run_unit_tests-7.4
            - run_unit_tests-8.0

  # main and main-beta publish releases, so a failed E2E run stops them.
  # Keep the test jobs in step with test_and_package above.
  release:
    when:
      matches:
        pattern: "^main(-beta)?$"
        value: << pipeline.git.branch >>
    jobs:
      - prepare:
          <<: *context
          restore_dep_caches: false
      - run_unit_tests:
          <<: *test_job_config
          matrix:
            parameters:
              php: ['7.4', '8.0']
      - run_e2e_tests:
          <<: *test_job_config
      - build_package:
          <<: *context
          requires:
            - run_unit_tests-7.4
            - run_unit_tests-8.0
            - run_e2e_tests
      - publish_release:
          <<: *context
          requires:
            - build_package
